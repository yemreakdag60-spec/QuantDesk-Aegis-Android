name: Build QuantDesk APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          PROJECT_FILE="$(find . -type f -name settings.gradle -print -quit)"
          if [ -n "$PROJECT_FILE" ] && ! grep -Eq "versionName[[:space:]]+['\"]4\\.4\\.0['\"]" "$(dirname "$PROJECT_FILE")/app/build.gradle"; then
            PROJECT_FILE=""
          fi
          if [ -z "$PROJECT_FILE" ]; then
            ZIP_COUNT=0
            while IFS= read -r SOURCE_ZIP; do
              ZIP_COUNT=$((ZIP_COUNT + 1))
              EXTRACT_DIR="$RUNNER_TEMP/aegis-source/$ZIP_COUNT"
              mkdir -p "$EXTRACT_DIR"
              if unzip -q "$SOURCE_ZIP" -d "$EXTRACT_DIR"; then
                CANDIDATE_FILE="$(find "$EXTRACT_DIR" -type f -name settings.gradle -print -quit)"
                if [ -n "$CANDIDATE_FILE" ] && grep -Eq "versionName[[:space:]]+['\"]4\\.4\\.0['\"]" "$(dirname "$CANDIDATE_FILE")/app/build.gradle"; then
                  PROJECT_FILE="$CANDIDATE_FILE"
                  break
                fi
              fi
            done < <(find . -maxdepth 3 -type f -iname '*.zip' -print)
            if [ "$ZIP_COUNT" -eq 0 ]; then
              echo "Neither settings.gradle nor a source ZIP was found in the repository." >&2
              exit 1
            fi
          fi
          if [ -z "$PROJECT_FILE" ]; then
            echo "settings.gradle was not found after extracting the source ZIP." >&2
            exit 1
          fi
          PROJECT_ROOT="$(dirname "$PROJECT_FILE")"
          echo "root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT_ROOT"

      - name: Validate bundled UI
        run: |
          cd "${{ steps.project.outputs.root }}"
          node -e "const fs=require('fs'),vm=require('vm');const h=fs.readFileSync('app/src/main/assets/index.html','utf8');const m=h.match(/<script>([\\s\\S]*?)<\\/script>/);if(!m)throw new Error('Bundled UI script was not found');new vm.Script(m[1],{filename:'index.html'});for(const x of ['Net R/R TP1','Net R/R TP2','Net R/R TP3','Adaptif Stop Loss'])if(!h.includes(x))throw new Error('Missing field: '+x);console.log('Bundled UI validation passed');"

      - name: Run unit tests
        run: |
          cd "${{ steps.project.outputs.root }}"
          gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: |
          cd "${{ steps.project.outputs.root }}"
          gradle --no-daemon :app:assembleDebug

      - name: Run Android Lint
        id: lint
        continue-on-error: true
        run: |
          cd "${{ steps.project.outputs.root }}"
          gradle --no-daemon :app:lintDebug

      - name: Upload Lint report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: QuantDesk-Aegis-V4.4.0-Lint-Report
          path: |
            **/app/build/reports/lint-results-debug.html
            **/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
            ${{ runner.temp }}/aegis-source/**/app/build/reports/lint-results-debug.html
            ${{ runner.temp }}/aegis-source/**/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: warn

      - name: Upload APK
        if: success() || steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: QuantDesk-Aegis-Professional-V4.4.0
          path: |
            **/app/build/outputs/apk/debug/app-debug.apk
            ${{ runner.temp }}/aegis-source/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Enforce Lint result
        if: steps.lint.outcome == 'failure'
        run: |
          echo "Android Lint failed. Download the Lint Report artifact for the complete diagnostics." >&2
          exit 1
