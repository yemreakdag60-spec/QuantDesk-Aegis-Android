name: Build QuantDesk Aegis Separate APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'

      - name: Locate separate-install Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_FILE="$(find . -maxdepth 4 -type f -name settings.gradle -print -quit || true)"

          if [ -z "$PROJECT_FILE" ]; then
            SOURCE_ZIP=""

            for candidate in \
              "QuantDesk-Aegis-V4.7.0-Professional-SEPARATE-Source.zip" \
              "QuantDesk-Aegis-V4.7.0-Professional-Separate-Source.zip"; do
              if [ -f "$candidate" ]; then
                SOURCE_ZIP="$candidate"
                break
              fi
            done

            if [ -z "$SOURCE_ZIP" ]; then
              SOURCE_ZIP="$(find . -maxdepth 3 -type f \( -iname '*Aegis*Separate*Source*.zip' -o -iname '*Aegis*V4.7*.zip' \) -print -quit || true)"
            fi

            if [ -z "$SOURCE_ZIP" ]; then
              echo "Separate-install source ZIP was not found." >&2
              exit 1
            fi

            EXTRACT_DIR="$RUNNER_TEMP/aegis-separate-source"
            rm -rf "$EXTRACT_DIR"
            mkdir -p "$EXTRACT_DIR"
            unzip -q "$SOURCE_ZIP" -d "$EXTRACT_DIR"
            PROJECT_FILE="$(find "$EXTRACT_DIR" -type f -name settings.gradle -print -quit || true)"
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo "settings.gradle was not found." >&2
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$PROJECT_FILE")"
          APP_GRADLE="$PROJECT_ROOT/app/build.gradle"

          test -f "$APP_GRADLE" || { echo "app/build.gradle was not found." >&2; exit 1; }
          grep -Fq "applicationId 'com.quantdesk.aegis.professional.v470'" "$APP_GRADLE" || { echo "Separate applicationId is missing." >&2; exit 1; }
          grep -Fq "versionName '4.7.0'" "$APP_GRADLE" || { echo "Expected versionName 4.7.0 was not found." >&2; exit 1; }

          echo "root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT_ROOT"

      - name: Validate bundled UI and source invariants
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.root }}"
          node tools/validate-ui.js
          node tools/test-reachable-tp.js
          grep -Fq 'android.useAndroidX=true' gradle.properties
          grep -Fq "implementation 'com.squareup.okhttp3:okhttp:4.12.0'" app/build.gradle
          grep -Fq 'android:label="Aegis V4.7 Professional"' app/src/main/AndroidManifest.xml

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.root }}"
          gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.root }}"
          gradle --no-daemon :app:assembleDebug

      - name: Run Android Lint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.root }}"
          gradle --no-daemon :app:lintDebug

      - name: Upload Lint report
        if: always() && steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: QuantDesk-Aegis-V4.7-Lint-Report
          path: |
            ${{ steps.project.outputs.root }}/app/build/reports/lint-results-debug.html
            ${{ steps.project.outputs.root }}/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: warn

      - name: Upload separate-install APK
        if: success() || steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: QuantDesk-Aegis-Pro-V4.7-SEPARATE
          path: ${{ steps.project.outputs.root }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Enforce Lint result
        if: steps.lint.outcome == 'failure'
        shell: bash
        run: |
          echo "Android Lint failed. Download the Lint Report artifact for diagnostics." >&2
          exit 1
