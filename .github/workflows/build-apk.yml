name: Build QuantDesk Prism APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Test and build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Locate QuantDesk Prism project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f QuantDesk-Prism-Uzun-Vade-Source.zip ]]; then
            mkdir -p "$RUNNER_TEMP/quantdesk-prism-source"
            unzip -q QuantDesk-Prism-Uzun-Vade-Source.zip -d "$RUNNER_TEMP/quantdesk-prism-source"
            project="$RUNNER_TEMP/quantdesk-prism-source/QuantDesk-Prism"
          elif [[ -f QuantDesk-Prism/app/build.gradle ]] && grep -q "applicationId 'com.emreakdag.quantdesk.prism250longterm'" QuantDesk-Prism/app/build.gradle; then
            project="$GITHUB_WORKSPACE/QuantDesk-Prism"
          elif [[ -f app/build.gradle ]] && grep -q "applicationId 'com.emreakdag.quantdesk.prism250longterm'" app/build.gradle; then
            project="$GITHUB_WORKSPACE"
          else
            echo "::error title=QuantDesk Prism source missing::Upload QuantDesk-Prism-Uzun-Vade-Source.zip to the repository root, or add the extracted QuantDesk-Prism project."
            exit 1
          fi
          if [[ ! -f "$project/settings.gradle" || ! -f "$project/scripts/test-analysis.cjs" ]]; then
            echo "::error title=Incomplete QuantDesk Prism source::The located project is missing settings.gradle or scripts/test-analysis.cjs. Upload the complete source ZIP."
            exit 1
          fi
          if ! grep -q "applicationId 'com.emreakdag.quantdesk.prism250longterm'" "$project/app/build.gradle"; then
            echo "::error title=Wrong Android package::The selected project is not the separate QuantDesk Prism Uzun Vade app."
            exit 1
          fi
          echo "PROJECT_DIR=$project" >> "$GITHUB_ENV"

      - name: Test analysis model
        run: node "$PROJECT_DIR/scripts/test-analysis.cjs"

      - name: Build debug APK
        run: cd "$PROJECT_DIR" && gradle --no-daemon :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuantDesk-Prism-Uzun-Vade-1.0.0
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
