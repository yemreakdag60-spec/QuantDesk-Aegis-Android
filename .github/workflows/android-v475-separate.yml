name: Build QuantDesk Aegis V4.7.5 Separate APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify V4.7.5 source archive
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ZIP="QuantDesk-Aegis-V4.7.5-Compare-SEPARATE-Source.zip"

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "Source ZIP is missing from the repository root: $SOURCE_ZIP" >&2
            exit 1
          fi

          unzip -tq "$SOURCE_ZIP"

          ZIP_CONTENTS="$(unzip -Z1 "$SOURCE_ZIP")"

          if ! grep -Eq '(^|/)settings.gradle$' <<< "$ZIP_CONTENTS"; then
            echo "The ZIP does not contain settings.gradle." >&2
            exit 1
          fi

          if ! grep -Eq '(^|/)app/build.gradle$' <<< "$ZIP_CONTENTS"; then
            echo "The ZIP does not contain app/build.gradle." >&2
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - name: Locate separate-install Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_FILE="$(find . -maxdepth 4 -type f -name settings.gradle -print -quit || true)"

          if [ -z "$PROJECT_FILE" ]; then
            SOURCE_ZIP="QuantDesk-Aegis-V4.7.5-Compare-SEPARATE-Source.zip"
            EXTRACT_DIR="$RUNNER_TEMP/aegis-separate-source"

            rm -rf "$EXTRACT_DIR"
            mkdir -p "$EXTRACT_DIR"
            unzip -q "$SOURCE_ZIP" -d "$EXTRACT_DIR"

            PROJECT_FILE="$(find "$EXTRACT_DIR" -type f -name settings.gradle -print -quit || true)"
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo "settings.gradle was not found." >&2
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$PROJECT_FILE")"
          APP_GRADLE="$PROJECT_ROOT/app/build.gradle"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "app/build.gradle was not found." >&2
            exit 1
          fi

          if ! grep -Fq "implementation 'androidx.webkit:webkit:1.17.1'" "$APP_GRADLE"; then
            echo "Expected AndroidX WebKit 1.17.1 was not found." >&2
            exit 1
          fi

          if ! grep -Fq "applicationId 'com.quantdesk.aegis.professional.v475'" "$APP_GRADLE"; then
            echo "Separate applicationId is missing." >&2
            exit 1
          fi

          if ! grep -Fq "versionName '4.7.5'" "$APP_GRADLE"; then
            echo "Expected versionName 4.7.5 was not found." >&2
            exit 1
          fi

          echo "root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT_ROOT"

      - name: Validate bundled UI and source invariants
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.root }}"

          node tools/validate-ui.js
          node tools/test-live-score-thresholds.js
          node tools/test-reachable-tp.js
          node tools/test-spot-flow.js
          node tools/test-live-watch-queue.js
          node tools/test-levels-valid.js
          node tools/test-stretch-gate.js
          node tools/test-target-selection.js
          node tools/test-closed-candles.js
          node tools/test-indicator-core.js
          node tools/test-walk-forward-gate.js
          node tools/test-position-sizing-guard.js
          node tools/test-trade-plan-display.js

          grep -Fq 'android.useAndroidX=true' gradle.properties
          grep -Fq "implementation 'com.squareup.okhttp3:okhttp:4.12.0'" app/build.gradle
          grep -Fq "implementation 'androidx.webkit:webkit:1.17.1'" app/build.gradle
          grep -Fq 'android:label="Aegis V4.7.5 Compare"' app/src/main/AndroidManifest.xml

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.root }}"
          gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.root }}"
          gradle --no-daemon :app:assembleDebug

      - name: Run Android Lint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.root }}"
          gradle --no-daemon :app:lintDebug

      - name: Upload Lint report
        if: always() && steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: QuantDesk-Aegis-V4.7.5-Compare-Lint-Report
          path: |
            ${{ steps.project.outputs.root }}/app/build/reports/lint-results-debug.html
            ${{ steps.project.outputs.root }}/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: warn

      - name: Enforce Lint result
        if: steps.lint.outcome == 'failure'
        shell: bash
        run: |
          echo "Android Lint failed. The APK will not be uploaded. Download the Lint Report artifact." >&2
          exit 1

      - name: Upload separate-install APK
        if: success() && steps.lint.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: QuantDesk-Aegis-Pro-V4.7.5-COMPARE-SEPARATE
          path: ${{ steps.project.outputs.root }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
