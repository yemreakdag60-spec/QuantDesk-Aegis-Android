name: Build QuantDesk FlowGuard V4.2.2

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Extract Android source
        run: unzip -o QuantDesk-Aegis-Android-Source-V4.2.2.zip -d project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuantDesk-Aegis-FlowGuard-V4.2.2
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
