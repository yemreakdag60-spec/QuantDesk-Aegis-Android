name: Build QuantDesk APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'

      - name: Validate bundled UI
        run: node tools/validate-ui.js

      - name: Verify and build debug APK
        run: gradle --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: QuantDesk-Aegis-Professional-V4.4.0
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
