name: Build QuantDesk Prism APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '**.zip'
      - 'app/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'tests/**'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
concurrency:
  group: prism-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare complete source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, zipfile
          if Path('app/build.gradle').is_file() and Path('settings.gradle').is_file():
              source = Path('.').resolve()
          else:
              archives = sorted(Path('.').glob('QuantDesk-Prism-*-Source.zip'))
              if len(archives) != 1:
                  raise SystemExit('Repository root must contain exactly one QuantDesk-Prism-*-Source.zip; remove older Prism source ZIPs.')
              source = Path('prism-source').resolve()
              source.mkdir(exist_ok=True)
              with zipfile.ZipFile(archives[0]) as z:
                  for member in z.infolist():
                      target = (source / member.filename).resolve()
                      if not target.is_relative_to(source):
                          raise SystemExit('Unsafe ZIP path')
                  z.extractall(source)
              if not (source / 'app/build.gradle').is_file():
                  raise SystemExit('Source ZIP structure is invalid')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('PRISM_SOURCE=' + str(source) + '\n')
          PY
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install required Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Node for analysis tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify analysis engine
        working-directory: ${{ env.PRISM_SOURCE }}
        run: node --test tests/engine.test.cjs
      - name: Build APK and run Android lint
        working-directory: ${{ env.PRISM_SOURCE }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:lintDebug
      - name: Package installable APK
        shell: bash
        run: |
          mkdir -p output
          cp "$PRISM_SOURCE/app/build/outputs/apk/debug/app-debug.apk" output/QuantDesk-Prism-1.0.0.apk
          cd output
          sha256sum QuantDesk-Prism-1.0.0.apk > SHA256.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuantDesk-Prism-1.0.0-APK
          path: output/
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QuantDesk-Prism-build-reports
          path: |
            ${{ env.PRISM_SOURCE }}/app/build/reports/
          if-no-files-found: ignore
