name: Build QuantDesk Aegis V4.8.1 Separate APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_FILE="$(find . -maxdepth 4 -type f -name settings.gradle -print -quit || true)"

          if [ -z "$PROJECT_FILE" ]; then
            SOURCE_ZIP=""

            for candidate in \
              "QuantDesk-Aegis-V4.8.1-Professional-SEPARATE-Source.zip"; do
              if [ -f "$candidate" ]; then
                SOURCE_ZIP="$candidate"
                break
              fi
            done

            if [ -z "$SOURCE_ZIP" ]; then
              SOURCE_ZIP="$(find . -maxdepth 3 -type f \( -iname '*Aegis*Separate*Source*.zip' -o -iname '*Aegis*V4.8.1*.zip' \) -print -quit || true)"
            fi

            if [ -z "$SOURCE_ZIP" ]; then
              echo "V4.8.1 kaynak ZIP dosyası bulunamadı." >&2
              exit 1
            fi

            EXTRACT_DIR="$RUNNER_TEMP/aegis-v481-source"
            rm -rf "$EXTRACT_DIR"
            mkdir -p "$EXTRACT_DIR"
            unzip -q "$SOURCE_ZIP" -d "$EXTRACT_DIR"

            PROJECT_FILE="$(find "$EXTRACT_DIR" -type f -name settings.gradle -print -quit || true)"
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo "settings.gradle bulunamadı." >&2
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$PROJECT_FILE")"
          APP_GRADLE="$PROJECT_ROOT/app/build.gradle"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "app/build.gradle bulunamadı." >&2
            exit 1
          fi

          grep -Fq "applicationId 'com.quantdesk.aegis.professional.v480'" "$APP_GRADLE" || {
            echo "Ayrı kurulum applicationId değeri bulunamadı." >&2
            exit 1
          }

          grep -Fq "versionName '4.8.1'" "$APP_GRADLE" || {
            echo "versionName 4.8.1 bulunamadı." >&2
            exit 1
          }

          echo "root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"
          echo "Android proje yolu: $PROJECT_ROOT"

      - name: Validate bundled UI and source
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.root }}"

          node tools/validate-ui.js
          node tools/test-reachable-tp.js
          node tools/test-spot-flow.js
          node tools/test-live-watch-queue.js
          node tools/test-levels-valid.js
          node tools/test-stretch-gate.js
          node tools/test-target-selection.js
          node tools/test-closed-candles.js
          node tools/test-indicator-core.js
          node tools/test-walk-forward-gate.js
          node tools/test-position-sizing-guard.js
          node tools/test-trade-plan-display.js
          node tools/test-v480-professional.js

          grep -Fq 'android.useAndroidX=true' gradle.properties
          grep -Fq "implementation 'com.squareup.okhttp3:okhttp:4.12.0'" app/build.gradle
          grep -Fq "implementation 'androidx.webkit:webkit:1.16.0'" app/build.gradle
          grep -Fq 'android:label="Aegis V4.8.1 Professional"' app/src/main/AndroidManifest.xml

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.root }}"
          gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.root }}"
          gradle --no-daemon :app:assembleDebug

      - name: Run Android Lint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.root }}"
          gradle --no-daemon :app:lintDebug

      - name: Upload Lint report
        if: always() && steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: QuantDesk-Aegis-V4.8.1-Lint-Report
          path: |
            ${{ steps.project.outputs.root }}/app/build/reports/lint-results-debug.html
            ${{ steps.project.outputs.root }}/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: warn

      - name: Upload APK
        if: success() || steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: QuantDesk-Aegis-Pro-V4.8.1-SEPARATE
          path: ${{ steps.project.outputs.root }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Enforce Lint result
        if: steps.lint.outcome == 'failure'
        shell: bash
        run: |
          echo "Android Lint başarısız oldu. Tanılama için Lint Report artefaktını indir." >&2
          exit 1
