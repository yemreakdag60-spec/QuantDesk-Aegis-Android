name: Build QuantDesk APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_FILE="$(find . -type f -name settings.gradle -print -quit || true)"

          if [ -n "$PROJECT_FILE" ]; then
            ROOT="$(dirname "$PROJECT_FILE")"

            if ! grep -Eq "versionName[[:space:]]+['\"]4\.4\.0['\"]" "$ROOT/app/build.gradle"; then
              PROJECT_FILE=""
            fi
          fi

          if [ -z "$PROJECT_FILE" ]; then
            SOURCE_ZIP=""

            if [ -f "QuantDesk-Aegis-V4.4.0-Professional-Source-FIXED.zip" ]; then
              SOURCE_ZIP="QuantDesk-Aegis-V4.4.0-Professional-Source-FIXED.zip"

            elif [ -f "QuantDesk-Aegis-V4.4.0-Professional-Source.zip" ]; then
              SOURCE_ZIP="QuantDesk-Aegis-V4.4.0-Professional-Source.zip"

            else
              SOURCE_ZIP="$(find . -maxdepth 3 -type f -iname '*V4.4.0*.zip' -print -quit || true)"
            fi

            if [ -z "$SOURCE_ZIP" ]; then
              echo "V4.4.0 source ZIP was not found." >&2
              exit 1
            fi

            echo "Using source archive: $SOURCE_ZIP"

            EXTRACT_DIR="$RUNNER_TEMP/aegis-source"

            rm -rf "$EXTRACT_DIR"
            mkdir -p "$EXTRACT_DIR"

            unzip -q "$SOURCE_ZIP" -d "$EXTRACT_DIR"

            PROJECT_FILE="$(find "$EXTRACT_DIR" -type f -name settings.gradle -print -quit || true)"
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo "settings.gradle was not found." >&2
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$PROJECT_FILE")"

          if [ ! -f "$PROJECT_ROOT/app/build.gradle" ]; then
            echo "app/build.gradle was not found." >&2
            exit 1
          fi

          if ! grep -Eq "versionName[[:space:]]+['\"]4\.4\.0['\"]" "$PROJECT_ROOT/app/build.gradle"; then
            echo "Expected versionName 4.4.0 was not found." >&2
            exit 1
          fi

          echo "root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT_ROOT"

      - name: Validate bundled UI
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.root }}"

          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');

          const path = 'app/src/main/assets/index.html';

          if (!fs.existsSync(path)) {
            throw new Error('Bundled UI index.html was not found');
          }

          const html = fs.readFileSync(path, 'utf8');

          const match = html.match(/<script>([\s\S]*?)<\/script>/);

          if (!match) {
            throw new Error('Bundled UI script was not found');
          }

          new vm.Script(match[1], {
            filename: 'index.html'
          });

          for (const field of [
            'Net R/R TP1',
            'Net R/R TP2',
            'Net R/R TP3',
            'Adaptif Stop Loss'
          ]) {
            if (!html.includes(field)) {
              throw new Error('Missing field: ' + field);
            }
          }

          console.log('Bundled UI validation passed');
          NODE

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.root }}"

          gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.root }}"

          gradle --no-daemon :app:assembleDebug

      - name: Run Android Lint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.root }}"

          gradle --no-daemon :app:lintDebug

      - name: Upload Lint report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: QuantDesk-Aegis-V4.4.0-Lint-Report
          path: |
            ${{ steps.project.outputs.root }}/app/build/reports/lint-results-debug.html
            ${{ steps.project.outputs.root }}/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: warn

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: QuantDesk-Aegis-Professional-V4.4.0
          path: |
            ${{ steps.project.outputs.root }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Enforce Lint result
        if: steps.lint.outcome == 'failure'
        shell: bash
        run: |
          echo "Android Lint failed. Download the Lint Report artifact for diagnostics." >&2
          exit 1
